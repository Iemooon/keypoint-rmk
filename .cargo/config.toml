[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip nRF52840_xxAA"

# Use flip-link overflow check: https://github.com/knurling-rs/flip-link
linker = "flip-link"

[build]
target = "thumbv7em-none-eabihf"     # Cortex-M4F and Cortex-M7F (with FPU)

[env]
DEFMT_LOG = "debug"

# Makes rmk-types/build.rs read the project-root keyboard.toml (event-channel
# quotas only; matrix/keymap stay in Rust via rmk.config()).
# relative = true resolves against this file's parent directory.
KEYBOARD_TOML_PATH = { value = "keyboard.toml", relative = true }
