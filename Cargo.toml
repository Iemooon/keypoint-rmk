[package]
name = "Keypoint-rmk"
version = "0.1.0"
authors = ["Lemon"]
description = "Firmware for the Keypoint split keyboard (nRF52840, RMK-based)"
homepage = "https://github.com/Iemooon/keypoint-rmk"
repository = "https://github.com/Iemooon/keypoint-rmk"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# "display" pulls in embedded-graphics and enables the SplitMessage Layer/Wpm/Modifier
# variants that feed the right-half panel. It applies to BOTH bins (one Cargo.toml),
# and both halves must agree on it or their split messages disagree on enum tags.
# "use_1m_phy": the host's BT adapter shows 2M-PHY link flapping (b -> x -> b
# re-advertising spells); 1M is slower over the air but far more tolerant.
# Keep it until the adapter or its driver changes.
rmk = { git = "https://github.com/rmk-rs/rmk.git", rev = "d0502f17", default-features = false, features = ["defmt", "storage", "vial", "watchdog", "nrf52840_ble", "split", "async_matrix", "adafruit_bl", "display", "use_1m_phy"] }
# (No direct rmk-types dependency: rmk re-exports the whole crate as `rmk::types`.)

# The trackpad and the nub are their own `#[input_device]` structs; these are the
# traits those drivers are written against. Versions mirror rmk's own manifest.
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-graphics = "0.8"
heapless = "0.9"
# TrackPoint's exponential acceleration term (the C code calls expf). Soft-float,
# a few dozen cycles at a 200 Hz worst-case report rate.
libm = "0.2"
nrf-sdc = { version = "0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"


[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
